[watering]
# Water when the soil moisture drops below this percent
dry_level = 35
# Keep watering until the soil moisture reaches this percent
wet_level = 80
# Safety backstop: stop the pump after this many minutes even if the soil never reaches wet_level
max_run_minutes = 60
# Minutes to wait after watering for the water to soak in before checking the soil again
soak_minutes = 30

[moisture_sensor]
# Raw readings from calibrate_moisture.py: the sensor held in dry air, and in a glass of water
dry_reading = 20000
wet_reading = 8800
